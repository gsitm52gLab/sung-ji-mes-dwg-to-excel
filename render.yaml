# Render Blueprint. 리포지토리를 연결하면 이 파일대로 서비스가 만들어진다.
#
# 빌드 컨텍스트를 frontend/ 로 좁힌 것이 중요하다. 리포지토리 루트를 그대로
# 넘기면 도면 dxf 와 발주 엑셀까지 이미지에 딸려 들어간다.
services:
  - name: deck-order-check
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # sync:false 는 값을 리포지토리에 두지 않고 Blueprint 생성 시점에
      # 대시보드에서 직접 입력받는다는 뜻이다. 비밀은 여기 적지 않는다.
      - key: LLM_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      # 공급자와 모델은 값이 비밀이 아니므로 여기 적어 둔다. 갈아끼울 때는
      # 대시보드에서 이 둘만 고치면 되고 코드는 건드릴 필요가 없다.
      #
      # 기본값이 Gemini 인 것은 이것만 실제로 검증했기 때문이다. NVIDIA NIM 도
      # 같은 코드로 붙지만, 시도한 모델 셋이 각각 과부하(503)·사고과정 누출·
      # 404 였다. 쓰려면 아래로 바꾸고 모델을 먼저 확인할 것.
      #   NVIDIA  LLM_BASE_URL=https://integrate.api.nvidia.com/v1
      #           LLM_MODEL=<엔드포인트의 /models 로 확인한 값>
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-2.5-flash
