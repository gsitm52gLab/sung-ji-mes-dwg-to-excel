# Render Blueprint. 리포지토리를 연결하면 이 파일대로 서비스가 만들어진다.
#
# 빌드 컨텍스트를 frontend/ 로 좁힌 것이 중요하다. 리포지토리 루트를 그대로
# 넘기면 도면 dxf 와 발주 엑셀까지 이미지에 딸려 들어간다.
services:
  - name: deck-order-check
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # sync:false 는 값을 리포지토리에 두지 않고 Blueprint 생성 시점에
      # 대시보드에서 직접 입력받는다는 뜻이다. 비밀은 여기 적지 않는다.
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      # 모델을 바꾸고 싶으면 대시보드에서 이 값만 고치면 된다.
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
