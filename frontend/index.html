<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데크 발주 검증</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- 세션 쿠키가 없을 때 보이는 화면 -->
<div class="login-wrap" id="login-screen" hidden>
  <form class="login-box" id="login-form">
    <div class="brand"><i class="ti ti-building"></i><span>데크 발주 검증</span></div>
    <p class="hint">실제 도면 데이터가 올라가 있어 접속을 제한합니다. 비밀번호를 입력하세요.</p>
    <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required>
    <div class="err" id="login-error"></div>
    <button type="submit" id="login-submit">들어가기</button>
  </form>
</div>

<!-- 인증 후 채팅 화면 -->
<div class="card" id="app-screen" hidden>
  <div class="titlebar">
    <i class="ti ti-building"></i>
    <span class="title" id="site-title">식사푸르지오 파크센트</span>
    <span class="model" id="model-name"></span>
  </div>

  <div class="body">
    <div class="left">
      <div class="filerow">
        <div class="row"><i class="ti ti-file-description"></i><span class="tag">Shop</span><span class="fname">260601_식사푸르지오_DECK SHOP_B1F ,1F 발주 구간(0529 수취 반영도면).dwg</span></div>
        <div class="row"><i class="ti ti-file-description"></i><span class="tag">Detail</span><span class="fname">260610_식사푸르지오_DECK DETAIL.dwg</span></div>
      </div>

      <div class="chat" id="chat"></div>

      <div class="footnote">답변은 도면·엑셀 대조 결과에만 근거합니다. 발주 확정 전 원본 도면으로 교차 확인하세요.</div>

      <form class="inputrow" id="chat-form">
        <textarea id="input" rows="1" placeholder="질문을 입력하세요 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
        <button type="submit" id="send" aria-label="전송"><i class="ti ti-send"></i></button>
      </form>
    </div>

    <div class="right">
      <div>
        <div class="section-label">대조된 구역</div>
        <div class="zonelist" id="zonelist"></div>
      </div>

      <div class="hr"></div>

      <div>
        <div class="section-label">진행상황 <span class="demo-badge">데모</span></div>
        <div class="steps is-demo">
          <div class="step done"><i class="ti ti-circle-check"></i><span>도면 접수</span></div>
          <div class="step done"><i class="ti ti-circle-check"></i><span>AI 추출</span></div>
          <div class="step current"><i class="ti ti-loader-2"></i><span>불일치 대조</span></div>
          <div class="step todo"><i class="ti ti-circle-dashed"></i><span>발주 확정</span></div>
        </div>
      </div>

      <div class="hr"></div>

      <div class="section-label">도면 업로드 <span class="demo-badge">데모</span></div>
      <div class="is-demo" style="display:flex;flex-direction:column;gap:12px;">
        <div class="upcard">
          <i class="ti ti-file-description file"></i>
          <span class="lbl">Shop</span>
          <span class="stat">로드됨</span>
        </div>
        <div class="upcard">
          <i class="ti ti-file-description file"></i>
          <span class="lbl">Detail</span>
          <span class="stat">로드됨</span>
        </div>
        <button class="jandi-btn" disabled><i class="ti ti-send"></i>잔디 송부</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
