<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데크 발주 검증</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- 세션 쿠키가 없을 때 보이는 화면 -->
<div class="login-wrap" id="login-screen" hidden>
  <form class="login-box" id="login-form">
    <div class="brand"><i class="ti ti-building"></i><span>데크 발주 검증</span></div>
    <p class="hint">실제 도면 데이터가 올라가 있어 접속을 제한합니다. 비밀번호를 입력하세요.</p>
    <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required>
    <div class="err" id="login-error"></div>
    <button type="submit" id="login-submit">들어가기</button>
  </form>
</div>

<!-- 인증 후 채팅 화면 -->
<div class="card" id="app-screen" hidden>
  <div class="titlebar">
    <i class="ti ti-building"></i>
    <span class="title" id="site-title">식사푸르지오 파크센트</span>
    <span class="model" id="model-name"></span>
  </div>

  <div class="body">
    <div class="left">
      <div class="filerow">
        <div class="row"><i class="ti ti-file-description"></i><span class="tag">Shop</span><span class="fname">260601_식사푸르지오_DECK SHOP_B1F ,1F 발주 구간(0529 수취 반영도면).dwg</span></div>
        <div class="row"><i class="ti ti-file-description"></i><span class="tag">Detail</span><span class="fname" id="detail-name">260610_식사푸르지오_DECK DETAIL.dwg</span></div>
      </div>

      <div class="chat" id="chat"></div>

      <div class="footnote">답변은 도면·엑셀 대조 결과에만 근거합니다. 발주 확정 전 원본 도면으로 교차 확인하세요.</div>

      <form class="inputrow" id="chat-form">
        <textarea id="input" rows="1" placeholder="질문을 입력하세요 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
        <button type="submit" id="send" aria-label="전송"><i class="ti ti-send"></i></button>
      </form>
    </div>

    <div class="right">
      <div>
        <div class="section-label">대조된 구역</div>
        <div class="zonelist" id="zonelist"></div>
      </div>

      <div class="hr"></div>

      <!-- 진행상황: 평소에는 없다. 업로드 처리 중에만 나타난다. -->
      <div id="progress-block" hidden>
        <div class="section-label">진행상황</div>
        <div class="steps" id="steps"></div>
      </div>

      <div class="hr" id="progress-hr" hidden></div>

      <div>
        <div class="section-label">도면 업로드</div>
        <input type="file" id="dwg-file" accept=".dwg" hidden>
        <button type="button" class="upload-btn" id="pick-file">
          <i class="ti ti-upload"></i>
          <span class="lbl">dwg 파일 선택</span>
          <span class="sub">DETAIL 도면을 올리면 일람표를 대조합니다</span>
        </button>
        <div class="upload-note" id="upload-note"></div>
      </div>

      <button class="jandi-btn" disabled title="이번 범위 밖입니다">
        <i class="ti ti-send"></i>잔디 송부 <span class="demo-badge">데모</span>
      </button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
