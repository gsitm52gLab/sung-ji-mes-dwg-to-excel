# 전체 파이프라인 입출력 경로 (단일 진실 공급원).
# 경로는 이 파일 위치(리포지토리 루트) 기준으로 해석하며, 절대경로도 허용한다.
# 환경변수 DECK_CONFIG로 다른 설정 파일을 지정할 수 있다.

# 1단계: dwg -> dxf (convert-dwg-to-dxf.sh / Docker, ODAFileConverter)
# ODAFileConverter는 폴더 단위로 dwg를 통째로 dxf로 변환하므로 폴더만 지정한다.
convert:
  dwg_dir: "arch-docs/dwg"                 # 입력 dwg 폴더 (docker -v :/input)
  dxf_dir: "convert-dwg-to-dxf/output"     # 출력 dxf 폴더 (docker -v :/output). 2단계 입력과 동일.

# 2단계: dxf -> excel (emit_*.py)
# emit은 여러 dxf 중 특정 파일을 골라 읽으므로 파일명을 명시한다.
# 파일명은 1단계가 arch-docs/dwg의 dwg를 변환해 만든 결과물 이름과 일치해야 한다.
emit:
  input:
    shop_dxf:   "convert-dwg-to-dxf/output/260601_식사푸르지오_DECK SHOP_B1F ,1F 발주 구간(0529 수취 반영도면).dxf"
    detail_dxf: "convert-dwg-to-dxf/output/260610_식사푸르지오_DECK DETAIL.dxf"
    excel_glob: "arch-docs/excel/*.xlsm"
  output:
    areas_dir:   "convert-dxf-to-excel/output/area"    # emit_areas.py
    by_zone_dir: "convert-dxf-to-excel/output/zone"    # emit_by_zone.py / emit_order.py / emit_sheet1.py
