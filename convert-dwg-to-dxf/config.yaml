# convert-dwg-to-dxf.sh 가 이 파일을 읽어 DWG→DXF 변환을 실행한다.
# 경로는 이 파일(convert-dwg-to-dxf/)이 있는 디렉토리 기준으로 해석한다.
# arch-docs/ 는 상위 디렉토리에 있으므로 ../ 로 시작한다.

docker:
  image: "oda-converter"        # docker build 로 만든 이미지 이름
  platform: "linux/amd64"       # ODAFileConverter 는 amd64 전용

input:
  dir: "../arch-docs/dwg"       # 변환할 DWG 원본 폴더 (컨테이너 /input 에 마운트)

output:
  dir: "output"                 # 변환 결과 DXF 를 저장할 폴더 (컨테이너 /output 에 마운트)

# ODAFileConverter 인자
oda:
  output_version: "ACAD2018"    # 출력 DXF 버전
  output_type: "DXF"            # 출력 포맷
  recurse: "0"                  # 하위 폴더 재귀 여부 (0=끔)
  audit: "1"                    # 변환 시 감사/복구 수행 여부 (1=켬)
